name: Fork debug build

on:
  push:
    branches: ["phonepad-dpad"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Assemble legacy debug APK
        run: ./gradlew :app:assembleLegacyDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gamenative-legacy-debug
          path: app/build/outputs/apk/legacy/debug/*.apk
